<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>STARWEBER: Card Pocket Creator</title>
    
    <!-- Three.js Core -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- GLTF Exporter -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>
    
    <style>
        :root {
            --color-heart: #ff4b72;   /* Bio/Love/Fluid */
            --color-diamond: #00e5ff; /* Tech/Scan/Projection */
            --color-club: #00ff7f;    /* Eco/Fusion/Recycle */
            --color-spade: #9d4edd;   /* Data/Spike/Materializer */
            --color-x: #ffffff;       /* Hub/Fold Core */

            --glass-bg: rgba(15, 20, 25, 0.6);
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-glow: rgba(255, 255, 255, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        
        body, html {
            width: 100%; height: 100%;
            background-color: #030305;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            touch-action: none;
            color: white;
        }

        /* 3D Canvas */
        #quantic-stage {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
        }

        #ui-layer {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            z-index: 10; pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between;
        }

        .interactive { pointer-events: auto; }

        /* Top Bar */
        .top-bar {
            display: flex; justify-content: space-between; padding: 15px;
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, transparent 100%);
        }

        .info-panel {
            font-size: 0.7rem; color: #ccc;
            text-shadow: 0 1px 3px black;
            max-width: 60%;
        }
        .info-panel h3 { font-size: 0.9rem; color: #fff; margin-bottom: 2px; }
        .info-panel .skat-name { font-weight: bold; color: var(--color-x); }

        /* Tool Menu (Right side top) */
        .tool-menu {
            display: flex; flex-direction: column; gap: 8px;
        }
        .icon-btn {
            width: 40px; height: 40px; border-radius: 50%;
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            color: white; font-size: 1.2rem; display: flex; justify-content: center; align-items: center;
            backdrop-filter: blur(10px); cursor: pointer; transition: 0.2s;
        }
        .icon-btn.active { background: rgba(255,255,255,0.2); box-shadow: 0 0 15px var(--glass-glow); border-color: white; }
        .icon-btn:active { transform: scale(0.9); }

        /* Bottom Controls (D-Pad & Sliders) */
        .bottom-controls {
            display: flex; flex-direction: column; align-items: center; gap: 15px;
            padding: 20px; background: linear-gradient(0deg, rgba(0,0,0,0.9) 0%, transparent 100%);
        }

        /* Brush Modifiers (Squash, Stretch, Gear) */
        .modifier-row {
            display: flex; gap: 10px; width: 100%; justify-content: center;
            background: rgba(0,0,0,0.4); padding: 10px; border-radius: 20px;
            backdrop-filter: blur(5px);
        }
        .mod-slider {
            display: flex; flex-direction: column; align-items: center; font-size: 0.55rem; width: 60px;
        }
        .mod-slider input { width: 100%; margin-top: 5px; accent-color: white; }

        /* D-PAD Configuration (Skat Core) */
        .d-pad-wrapper { display: flex; align-items: center; justify-content: center; width: 100%; gap: 20px; }
        
        .d-pad-container {
            position: relative; width: 130px; height: 130px; transform: scale(1);
        }

        .btn {
            position: absolute; width: 44px; height: 44px; border-radius: 10px;
            background: rgba(255,255,255,0.05); border: 2px solid var(--glass-border);
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; font-size: 1.3rem; backdrop-filter: blur(5px);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform: rotate(45deg);
        }
        .btn span { transform: rotate(-45deg); pointer-events: none; }
        .btn:active { transform: rotate(45deg) scale(0.85); }
        .btn.active { box-shadow: 0 0 20px currentColor, inset 0 0 10px currentColor; background: rgba(255,255,255,0.15); }

        .btn-top { top: 0; left: 43px; border-color: var(--color-heart); color: var(--color-heart); }
        .btn-left { top: 43px; left: 0; border-color: var(--color-diamond); color: var(--color-diamond); }
        .btn-right { top: 43px; right: 0; border-color: var(--color-club); color: var(--color-club); }
        .btn-bottom { bottom: 0; left: 43px; border-color: var(--color-spade); color: var(--color-spade); }
        .btn-center { top: 43px; left: 43px; border-radius: 50%; background: var(--glass-glow); border-color: var(--color-x); color: var(--color-x); }

        /* Fold Mechanism Button */
        .fold-btn {
            padding: 15px 25px; border-radius: 25px; font-weight: bold; font-size: 0.9rem;
            background: linear-gradient(45deg, #2a2a35, #4a4a5d); border: 1px solid #777;
            color: white; box-shadow: 0 5px 15px rgba(0,0,0,0.5); text-transform: uppercase;
            letter-spacing: 1px;
        }
        .fold-btn.folded { background: linear-gradient(45deg, var(--color-x), #888); color: black; }

        @media (min-width: 768px) {
            #ui-layer { flex-direction: row; }
            .top-bar { flex-direction: column; width: 250px; background: linear-gradient(90deg, rgba(0,0,0,0.8) 0%, transparent 100%); }
            .bottom-controls { width: 300px; background: linear-gradient(-90deg, rgba(0,0,0,0.9) 0%, transparent 100%); padding-top: 50px;}
            .modifier-row { flex-wrap: wrap; }
            .tool-menu { position: absolute; right: 20px; top: 20px; }
        }

        /* Message Box / Modals */
        #msg-box {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(10, 10, 15, 0.9); border: 1px solid var(--color-diamond);
            padding: 20px; border-radius: 15px; z-index: 100; text-align: center;
            display: none; backdrop-filter: blur(10px);
        }
        #msg-box button { margin-top: 15px; padding: 5px 15px; border-radius: 5px; background: white; color: black; border: none; font-weight: bold; cursor: pointer;}
    </style>
</head>
<body>

    <!-- 3D Environment -->
    <canvas id="quantic-stage"></canvas>

    <!-- UI Overlay -->
    <div id="ui-layer">
        
        <!-- Top Info & Tools -->
        <div class="top-bar interactive">
            <div class="info-panel" id="layer-info">
                <h3>STARWEBER OS</h3>
                <span class="skat-name" id="ui-skat-name">X-HUB (Core)</span><br>
                <span id="ui-skat-desc">Multi-view. Alle Sheets sichtbar. Wähle ein Set zum Zeichnen.</span>
            </div>
            
            <div class="tool-menu">
                <div class="icon-btn" onclick="toggleAudio()" id="btn-audio" title="Audio Reactive Pulse">🎙️</div>
                <div class="icon-btn" onclick="exportGLB()" title="Export 3D GLB">💾</div>
                <div class="icon-btn" onclick="clearActiveLayer()" title="Clear Layer">🗑️</div>
            </div>
        </div>

        <!-- Bottom Controls -->
        <div class="bottom-controls interactive">
            
            <!-- Brush Modifiers -->
            <div class="modifier-row">
                <div class="mod-slider">
                    <label>⚙️ Gear</label>
                    <input type="range" id="mod-gear" min="0" max="360" value="0">
                </div>
                <div class="mod-slider">
                    <label>↔️ Stretch</label>
                    <input type="range" id="mod-stretch" min="1" max="50" value="10">
                </div>
                <div class="mod-slider">
                    <label>↕️ Squash</label>
                    <input type="range" id="mod-squash" min="1" max="50" value="10">
                </div>
                <div class="mod-slider">
                    <label>🔍 Size</label>
                    <input type="range" id="mod-size" min="1" max="50" value="20">
                </div>
            </div>

            <!-- D-Pad & Fold Action -->
            <div class="d-pad-wrapper">
                <div class="d-pad-container">
                    <div class="btn btn-top" onclick="setLayer('heart')" id="btn-heart"><span>♥️</span></div>
                    <div class="btn btn-left" onclick="setLayer('diamond')" id="btn-diamond"><span>♦️</span></div>
                    <div class="btn btn-center active" onclick="setLayer('x')" id="btn-x"><span>❌</span></div>
                    <div class="btn btn-right" onclick="setLayer('club')" id="btn-club"><span>♣️</span></div>
                    <div class="btn btn-bottom" onclick="setLayer('spade')" id="btn-spade"><span>♠️</span></div>
                </div>
                
                <button class="fold-btn interactive" id="btn-fold" onclick="toggleFold()">POCKET<br>FOLD</button>
            </div>
            
            <!-- Disney Multiplane / Matroschka Slider -->
            <div class="mod-slider" style="width: 80%; padding-bottom: 10px;">
                <label>Matroschka Peel (Depth)</label>
                <input type="range" id="mod-depth" min="0" max="100" value="20" oninput="updateSheetDepth()">
            </div>
        </div>
    </div>

    <!-- Custom Alert Box -->
    <div id="msg-box">
        <p id="msg-text">Message</p>
        <button onclick="document.getElementById('msg-box').style.display='none'">OK</button>
    </div>

    <script>
        const LORE = {
            'heart': { name: '♥️ HERZ (Bio/Soul)', desc: 'Bubble fluid, Luftblasen, Emotionen, Erschaffen, Heilen.', color: 0xff4b72 },
            'diamond': { name: '♦️ KARO (Tech/Light)', desc: 'Eternity projection, Scan-Signal, Licht, Diamant-Kristalle.', color: 0x00e5ff },
            'club': { name: '♣️ KREUZ (Eco/Fusion)', desc: 'Recycling, Fusion, Treibstoff-Lenkung, Sphären-Pyramiden.', color: 0x00ff7f },
            'spade': { name: '♠️ PIK (Data/Spike)', desc: 'Materializer, organischer Flausch, Natur flooded, Körper-Manifestation.', color: 0x9d4edd },
            'x': { name: '❌ X-HUB (Core)', desc: 'Übersicht. Nutze Pocket Fold um die Membrane als 4-Eck zu falten.', color: 0xffffff }
        };

        // UI State
        let currentSuit = 'x';
        let isFolded = false;
        let isAudioReactive = false;
        
        // Brush Modifiers
        const mods = {
            gear: () => document.getElementById('mod-gear').value * (Math.PI/180),
            stretch: () => document.getElementById('mod-stretch').value / 10,
            squash: () => document.getElementById('mod-squash').value / 10,
            size: () => document.getElementById('mod-size').value / 20
        };

        function showMsg(text) {
            document.getElementById('msg-text').innerText = text;
            document.getElementById('msg-box').style.display = 'block';
        }

        const canvas = document.getElementById('quantic-stage');
        const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, preserveDrawingBuffer: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.outputEncoding = THREE.sRGBEncoding;

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x030305, 0.02);

        // Camera Setup
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 30);

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(10, 20, 15);
        scene.add(dirLight);
        const pointLight = new THREE.PointLight(0xffffff, 1, 50);
        camera.add(pointLight); // Light attached to camera
        scene.add(camera);

        // All Drawn Objects Group (For Export)
        const drawingsGroup = new THREE.Group();
        scene.add(drawingsGroup);

        // We create 4 physical sheets (planes) representing the Matroschka layers.
        const sheets = {};
        const sheetGeo = new THREE.PlaneGeometry(24, 36, 10, 10);
        
        // Base material for the Holo-Plastic (Foldable material)
        const plasticMat = new THREE.MeshPhysicalMaterial({
            transmission: 0.9, opacity: 1, metalness: 0.1, roughness: 0.2, ior: 1.5,
            thickness: 0.1, side: THREE.DoubleSide, transparent: true, wireframe: false
        });

        // Setup the 4 Suits
        ['heart', 'diamond', 'club', 'spade'].forEach((suit, index) => {
            const mat = plasticMat.clone();
            mat.color.setHex(LORE[suit].color);
            mat.emissive.setHex(LORE[suit].color);
            mat.emissiveIntensity = 0.1;
            
            // Add a subtle grid wireframe on top
            const mesh = new THREE.Mesh(sheetGeo, mat);
            const wire = new THREE.LineSegments(new THREE.WireframeGeometry(sheetGeo), new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.05 }));
            mesh.add(wire);

            // Container for origin manipulation (folding)
            const pivot = new THREE.Group();
            pivot.add(mesh);
            scene.add(pivot);

            // Group to hold drawings specific to this layer
            const drawnLayer = new THREE.Group();
            mesh.add(drawnLayer);

            sheets[suit] = { pivot, mesh, drawnLayer, index, baseZ: 0 };
        });

        // Update Depth (Disney Multiplane Effect)
        function updateSheetDepth() {
            if (isFolded) return; // Don't allow depth peeling while folded
            const depthVal = document.getElementById('mod-depth').value / 20; // 0 to 5
            
            Object.keys(sheets).forEach((suit) => {
                const s = sheets[suit];
                // In 'X' mode, stagger them. Otherwise, bring active to front.
                if (currentSuit === 'x') {
                    s.pivot.position.z = - (s.index * depthVal);
                    s.mesh.material.opacity = 1;
                } else {
                    if (currentSuit === suit) {
                        s.pivot.position.z = 0;
                        s.mesh.material.opacity = 1;
                    } else {
                        s.pivot.position.z = - (s.index * depthVal) - 2;
                        s.mesh.material.opacity = 0.2; // Dim inactive
                    }
                }
            });
        }

        function setLayer(suit) {
            currentSuit = suit;
            document.querySelectorAll('.d-pad-container .btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${suit}`).classList.add('active');

            document.getElementById('ui-skat-name').innerText = LORE[suit].name;
            document.getElementById('ui-skat-name').style.color = '#' + LORE[suit].color.toString(16).padStart(6, '0');
            document.getElementById('ui-skat-desc').innerText = LORE[suit].desc;

            // Unfold automatically if a specific layer is chosen for drawing
            if (isFolded && suit !== 'x') {
                toggleFold();
            }

            updateSheetDepth();
        }

        function toggleFold() {
            isFolded = !isFolded;
            const btn = document.getElementById('btn-fold');
            btn.classList.toggle('folded');
            
            if (isFolded) {
                // FOLD INTO POCKET (Polly Pocket / Triangle Polygon)
                // We rotate the pivots to form an open box or pyramid
                setLayer('x'); // Force X mode to see the fold
                
                // Animation targets for folding
                sheets['heart'].targetRot = {x: 0, y: Math.PI/2, z: 0};
                sheets['heart'].targetPos = {x: 12, y: 0, z: -12};

                sheets['diamond'].targetRot = {x: 0, y: -Math.PI/2, z: 0};
                sheets['diamond'].targetPos = {x: -12, y: 0, z: -12};

                sheets['club'].targetRot = {x: Math.PI/2, y: 0, z: 0};
                sheets['club'].targetPos = {x: 0, y: -18, z: -12};

                sheets['spade'].targetRot = {x: -Math.PI/2, y: 0, z: 0};
                sheets['spade'].targetPos = {x: 0, y: 18, z: -12};

                document.getElementById('mod-depth').disabled = true;

            } else {
                // UNFOLD FLAT
                Object.keys(sheets).forEach(suit => {
                    sheets[suit].targetRot = {x: 0, y: 0, z: 0};
                    sheets[suit].targetPos = {x: 0, y: 0, z: 0};
                });
                document.getElementById('mod-depth').disabled = false;
                updateSheetDepth(); // Restore multiplane z-positions
            }
        }

        function clearActiveLayer() {
            if (currentSuit === 'x') {
                Object.values(sheets).forEach(s => {
                    while(s.drawnLayer.children.length > 0) { s.drawnLayer.remove(s.drawnLayer.children[0]); }
                });
            } else {
                const l = sheets[currentSuit].drawnLayer;
                while(l.children.length > 0) { l.remove(l.children[0]); }
            }
        }

        // Geometries for the specific Lore
        const geos = {
            'heart': new THREE.SphereGeometry(1, 32, 32),          // Fluid Bubbles
            'diamond': new THREE.OctahedronGeometry(1, 0),         // Pyramid/Kristall
            'club': new THREE.ConeGeometry(1, 2, 8),               // Fusion Pods (Cone)
            'spade': new THREE.IcosahedronGeometry(1, 1)           // Spike Base
        };

        const materials = {
            'heart': new THREE.MeshPhysicalMaterial({ color: 0xff4b72, transmission: 1, roughness: 0.1, ior: 1.2, clearcoat: 1 }),
            'diamond': new THREE.MeshStandardMaterial({ color: 0x00e5ff, metalness: 0.8, roughness: 0.2, flatShading: true, emissive: 0x00e5ff, emissiveIntensity: 0.4 }),
            'club': new THREE.MeshStandardMaterial({ color: 0x00ff7f, roughness: 0.6, metalness: 0.2 }),
            'spade': new THREE.MeshPhongMaterial({ color: 0x9d4edd, shininess: 100, flatShading: true })
        };

        // Modify Spade geometry to be spiky (Materializer)
        const spikyGeo = geos['spade'];
        const posAttrib = spikyGeo.attributes.position;
        for (let i = 0; i < posAttrib.count; i++) {
            // Randomly extrude vertices
            if(Math.random() > 0.5) {
                posAttrib.setXYZ(i, posAttrib.getX(i)*1.5, posAttrib.getY(i)*1.5, posAttrib.getZ(i)*1.5);
            }
        }
        spikyGeo.computeVertexNormals();

        // Raycaster for drawing
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let isDrawing = false;
        let lastDrawPos = new THREE.Vector3();

        function getIntersects(clientX, clientY) {
            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            
            // If in X mode or Folded, drawing is disabled to prevent confusion, or we just draw on Heart as fallback
            if (currentSuit === 'x' || isFolded) return null;

            // Intersect with the currently active sheet
            const intersects = raycaster.intersectObject(sheets[currentSuit].mesh);
            return intersects.length > 0 ? intersects[0] : null;
        }

        function stampShape(intersect) {
            if (currentSuit === 'x' || isFolded) {
                showMsg("Wähle eine Kartenfarbe (♥️♦️♣️♠️) um zu zeichnen. Im X-HUB oder gefalteten Zustand ist Zeichnen deaktiviert.");
                isDrawing = false;
                return;
            }

            const pt = intersect.point;
            // Prevent drawing too many overlapping meshes
            if (lastDrawPos.distanceTo(pt) < 1.0) return; 
            lastDrawPos.copy(pt);

            // Create Mesh based on suit
            const mesh = new THREE.Mesh(geos[currentSuit], materials[currentSuit]);
            
            // Apply Brush Modifiers
            const sX = mods.stretch() * mods.size();
            const sY = mods.squash() * mods.size();
            const sZ = mods.size();
            mesh.scale.set(sX, sY, sZ);
            
            // Apply Gear mechanic rotation
            mesh.rotation.z = mods.gear() * (Math.random() * 5); // Spiky spin
            mesh.rotation.x = Math.random() * Math.PI;

            // Save base scale for Audio Reactive pulsing
            mesh.userData.baseScale = mesh.scale.clone();

            // Attach to the local drawn layer of the sheet
            // We need to convert world point to local point of the mesh
            sheets[currentSuit].mesh.worldToLocal(pt);
            mesh.position.copy(pt);
            
            // Offset slightly in Z to stand out from paper
            mesh.position.z += Math.random() * 0.5; 

            sheets[currentSuit].drawnLayer.add(mesh);
            
            // Also add to global group for easy GLB export (Optional: currently we export the whole scene or just sheets)
        }

        // Input Listeners
        const interactLayer = document.getElementById('ui-layer');

        function onDown(e) {
            if (e.target.closest('.interactive')) return; // Clicked UI
            isDrawing = true;
            const x = e.touches ? e.touches[0].clientX : e.clientX;
            const y = e.touches ? e.touches[0].clientY : e.clientY;
            const hit = getIntersects(x, y);
            if (hit) stampShape(hit);
        }

        function onMove(e) {
            if (!isDrawing) return;
            const x = e.touches ? e.touches[0].clientX : e.clientX;
            const y = e.touches ? e.touches[0].clientY : e.clientY;
            const hit = getIntersects(x, y);
            if (hit) stampShape(hit);
            
            // Orbital camera feel when in Folded X Mode
            if (isFolded && currentSuit === 'x') {
                camera.position.x = Math.sin(x * 0.01) * 40;
                camera.position.z = Math.cos(x * 0.01) * 40;
                camera.lookAt(0,0,-12);
            }
        }

        function onUp() { isDrawing = false; lastDrawPos.set(0,0,0); }

        window.addEventListener('mousedown', onDown);
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
        window.addEventListener('touchstart', onDown, {passive: false});
        window.addEventListener('touchmove', (e)=>{ if(e.target.closest('.interactive')) return; e.preventDefault(); onMove(e); }, {passive: false});
        window.addEventListener('touchend', onUp);

        let audioCtx, analyser, dataArray;
        
        async function toggleAudio() {
            const btn = document.getElementById('btn-audio');
            if (isAudioReactive) {
                isAudioReactive = false;
                btn.classList.remove('active');
                if (audioCtx) audioCtx.suspend();
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioCtx.createMediaStreamSource(stream);
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 128;
                source.connect(analyser);
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                
                isAudioReactive = true;
                btn.classList.add('active');
                showMsg("Audio Reactivity aktiviert. Singe, spreche oder klopfe um die Meshes vibrieren zu lassen.");
            } catch (err) {
                showMsg("Mikrofon-Zugriff verweigert oder nicht verfügbar.");
            }
        }

        function processAudio() {
            if (!isAudioReactive || !analyser) return 1;
            analyser.getByteFrequencyData(dataArray);
            let sum = 0;
            for(let i=0; i<dataArray.length; i++) sum += dataArray[i];
            const avg = sum / dataArray.length;
            return 1 + (avg / 256) * 1.5; // Scale multiplier based on volume
        }

        function exportGLB() {
            showMsg("Erstelle .glb Datei... Bitte warten.");
            
            // Create an exporter instance
            const exporter = new THREE.GLTFExporter();
            
            // We export the pivots containing the sheets and the drawn geometry
            const exportData = [];
            Object.values(sheets).forEach(s => exportData.push(s.pivot));

            exporter.parse(
                exportData,
                function (gltf) {
                    const output = JSON.stringify(gltf, null, 2);
                    const blob = new Blob([output], { type: 'text/plain' });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.style.display = 'none';
                    link.href = url;
                    link.download = 'STARWEBER_CardPocket.gltf';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(url);
                    document.getElementById('msg-box').style.display = 'none';
                },
                function (error) {
                    console.error(error);
                    showMsg("Fehler beim Exportieren.");
                }
            );
        }

        function animate() {
            requestAnimationFrame(animate);

            // 1. Lerp Animations for Folding/Unfolding
            const lerpSpeed = 0.05;
            Object.values(sheets).forEach(s => {
                if (s.targetPos) {
                    s.pivot.position.lerp(new THREE.Vector3(s.targetPos.x, s.targetPos.y, s.targetPos.z), lerpSpeed);
                    
                    // Simple rotation lerp
                    s.pivot.rotation.x += (s.targetRot.x - s.pivot.rotation.x) * lerpSpeed;
                    s.pivot.rotation.y += (s.targetRot.y - s.pivot.rotation.y) * lerpSpeed;
                    s.pivot.rotation.z += (s.targetRot.z - s.pivot.rotation.z) * lerpSpeed;
                }
            });

            // If not folded, ensure camera is centered
            if (!isFolded) {
                camera.position.x += (0 - camera.position.x) * lerpSpeed;
                camera.position.y += (0 - camera.position.y) * lerpSpeed;
                camera.position.z += (30 - camera.position.z) * lerpSpeed;
                camera.lookAt(0,0,0);
            }

            // 2. Audio Reactivity
            const audioScale = processAudio();
            Object.values(sheets).forEach(s => {
                s.drawnLayer.children.forEach(mesh => {
                    // Pulse the drawn objects
                    if (mesh.userData.baseScale) {
                        mesh.scale.x = mesh.userData.baseScale.x * audioScale;
                        mesh.scale.y = mesh.userData.baseScale.y * audioScale;
                        mesh.scale.z = mesh.userData.baseScale.z * audioScale;
                    }
                    // Add slight rotation to Club & Spade for organic feel
                    if(currentSuit === 'club' || currentSuit === 'spade') {
                        mesh.rotation.y += 0.01;
                    }
                });
            });

            renderer.render(scene, camera);
        }

        // Handle Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Init
        updateSheetDepth();
        animate();
        
        // Spawn some initial tech on X layer to demonstrate depth
        setTimeout(()=>{
            showMsg("Willkommen im Card Pocket Creator.\nWähle eine Farbe unten, um 3D-Formen auf die Holo-Plastik Layer zu stempeln.\nKlicke POCKET FOLD für die Magie.");
        }, 1000);

    </script>
</body>
</html>
