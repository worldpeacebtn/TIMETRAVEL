<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Web Data Vault - Cyber JRPG OS</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js for 3D Visuals -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>

    <style>
        :root {
            --neon-pink: #ff00ff;
            --neon-cyan: #00ffff;
            --neon-purple: #9d00ff;
            --neon-orange: #ff8800;
            --bg-twilight: #0a0212;
            --glass-bg: rgba(10, 2, 20, 0.6);
            --glass-border: rgba(255, 0, 255, 0.3);
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: var(--bg-twilight);
            color: #fff;
            font-family: 'Inter', system-ui, sans-serif;
            user-select: none;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }

        #canvas-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
        }

        /* --- UI Layers & Glassmorphism --- */
        .ui-layer {
            position: absolute;
            inset: 0;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .pointer-events-auto { pointer-events: auto; }

        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.1), inset 0 0 15px rgba(0, 255, 255, 0.05);
        }

        .text-glow {
            text-shadow: 0 0 10px currentColor, 0 0 20px currentColor;
        }

        /* --- Mobile Bottom 1/3 UI --- */
        #bottom-dashboard {
            height: 33vh;
            min-height: 250px;
            width: 100%;
            border-top-left-radius: 30px;
            border-top-right-radius: 30px;
            padding: 10px;
            position: relative;
            background: linear-gradient(0deg, rgba(0,0,0,0.9) 0%, rgba(10,2,20,0.7) 100%);
            border-top: 2px solid var(--neon-pink);
            box-shadow: 0 -10px 40px rgba(255, 0, 255, 0.2);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* --- Circular DJ Cyber Menu --- */
        .dj-dial-container {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: radial-gradient(circle, #222 0%, #000 100%);
            border: 3px solid var(--neon-cyan);
            box-shadow: 0 0 30px var(--neon-cyan), inset 0 0 20px var(--neon-purple);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            cursor: pointer;
            transition: all 0.3s;
        }
        .dj-dial-container:active { transform: translateX(-50%) scale(0.95); }
        .dj-dial-inner {
            width: 70%; height: 70%;
            border-radius: 50%;
            background: conic-gradient(from 0deg, var(--neon-pink), var(--neon-purple), var(--neon-cyan), var(--neon-pink));
            animation: spin 4s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* --- Crosshair & Effects --- */
        #crosshair {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 20px; height: 20px;
            border: 2px solid var(--neon-pink);
            border-radius: 50%;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            box-shadow: 0 0 10px var(--neon-pink);
        }
        #crosshair::after {
            content: ''; position: absolute;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 4px; height: 4px; background: var(--neon-cyan); border-radius: 50%;
        }

        #blink-overlay {
            position: fixed; inset: 0;
            background: black; z-index: 9999;
            pointer-events: none; opacity: 0;
            transition: opacity 0.1s ease-out;
        }
        .blink-flash { animation: blinkAnim 0.6s cubic-bezier(0.1, 0.8, 0.1, 1); }
        @keyframes blinkAnim {
            0% { opacity: 1; background: black; }
            40% { opacity: 1; background: white; }
            100% { opacity: 0; background: transparent; }
        }

        /* --- JRPG Narrator (Gwen) --- */
        #jrpg-narrator {
            position: absolute;
            bottom: 35vh; right: -100%;
            width: 80%; max-width: 400px;
            display: flex; align-items: flex-end;
            transition: right 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 50;
        }
        #jrpg-narrator.active { right: 10px; }
        .avatar-box {
            width: 100px; height: 120px;
            background: var(--neon-pink);
            clip-path: polygon(20% 0%, 100% 0, 100% 80%, 80% 100%, 0 100%, 0% 20%);
            position: relative;
            overflow: hidden;
            box-shadow: -5px 5px 0 var(--neon-cyan);
            flex-shrink: 0;
        }
        .speech-bubble {
            background: rgba(0,0,0,0.8);
            border: 2px solid var(--neon-cyan);
            border-radius: 12px 12px 12px 0;
            padding: 12px; margin-left: -10px; margin-bottom: 20px;
            font-size: 12px; font-family: monospace;
            box-shadow: 0 0 15px var(--neon-cyan);
            flex-grow: 1;
        }

        /* --- OS Modals --- */
        .os-modal {
            position: absolute; inset: 10px; bottom: 35vh;
            border-radius: 20px;
            transform: scale(0.9); opacity: 0; pointer-events: none;
            transition: all 0.3s;
            display: flex; flex-direction: column;
            overflow: hidden;
            z-index: 40;
        }
        .os-modal.show { transform: scale(1); opacity: 1; pointer-events: auto; }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--neon-pink); border-radius: 3px; }

        /* --- Top Helix Timeline --- */
        #top-timeline {
            display: flex; gap: 8px; overflow-x: auto;
            padding: 10px; padding-top: env(safe-area-inset-top, 20px);
            scrollbar-width: none;
        }
        .timeline-node {
            min-width: 40px; height: 40px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.5);
            color: #fff; font-size: 10px;
            flex-shrink: 0; cursor: pointer;
        }
        .timeline-node:hover, .timeline-node.active {
            border-color: var(--neon-pink);
            box-shadow: 0 0 10px var(--neon-pink);
            background: rgba(255,0,255,0.2);
        }

        /* Joysticks */
        .joy-zone {
            width: 100px; height: 100px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            border: 2px dashed rgba(255,255,255,0.2);
            position: relative;
        }
        .joy-knob {
            width: 40px; height: 40px;
            background: var(--neon-cyan);
            border-radius: 50%; position: absolute;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            box-shadow: 0 0 15px var(--neon-cyan);
        }

    </style>
</head>
<body class="antialiased">

    <div id="canvas-container"></div>
    <div id="crosshair"></div>
    <div id="blink-overlay"></div>

    <div class="ui-layer">
        
        <!-- Top Timeline / Minimap -->
        <div class="w-full pointer-events-auto glass border-b-0 rounded-b-xl pb-2">
            <div class="flex justify-between items-center px-4 pt-2">
                <span class="text-[10px] font-mono text-[var(--neon-pink)] text-glow tracking-widest uppercase">Arachna OS // Nav</span>
                <span id="location-text" class="text-[9px] text-gray-400 font-mono">SECTOR: NULL</span>
            </div>
            <div id="top-timeline">
                <!-- Generated by JS -->
            </div>
        </div>

        <!-- JRPG Narrator Overlay -->
        <div id="jrpg-narrator">
            <div class="avatar-box flex items-center justify-center">
                <!-- Simple SVG Anime-ish eye/face representation -->
                <svg viewBox="0 0 100 100" class="w-full h-full opacity-80">
                    <circle cx="50" cy="50" r="45" fill="#220022" />
                    <path d="M 20 40 Q 35 20 50 40 Q 65 20 80 40" fill="none" stroke="#00ffff" stroke-width="4" stroke-linecap="round"/>
                    <circle cx="35" cy="55" r="8" fill="#ff00ff" />
                    <circle cx="65" cy="55" r="8" fill="#ff00ff" />
                    <path d="M 40 75 Q 50 85 60 75" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
                </svg>
            </div>
            <div class="speech-bubble">
                <p id="jrpg-text" class="text-[var(--neon-cyan)] text-glow">Hey Player! Ready to dive into the Data Vaults? Try shooting a web!</p>
            </div>
        </div>

        <!-- OS Modals (Albums / Vaults / Paperdoll) -->
        <div id="vault-os" class="os-modal glass pointer-events-auto">
            <div class="flex items-center justify-between p-3 border-b border-[var(--glass-border)] bg-black/40">
                <h3 class="text-xs font-bold text-white tracking-widest">VAULT BROWSER</h3>
                <div class="flex gap-2">
                    <button class="view-btn text-[var(--neon-pink)]" data-view="grid"><i data-lucide="layout-grid" class="w-4 h-4"></i></button>
                    <button class="view-btn text-gray-400" data-view="list"><i data-lucide="list" class="w-4 h-4"></i></button>
                    <button onclick="toggleModal('vault-os')" class="text-gray-400 hover:text-white"><i data-lucide="x" class="w-4 h-4"></i></button>
                </div>
            </div>
            <div class="flex-1 overflow-y-auto p-4 flex flex-col gap-4" id="vault-content">
                <!-- Content injected via JS based on view -->
            </div>
            <div class="p-2 border-t border-[var(--glass-border)] flex justify-between">
                <button class="text-[10px] bg-[var(--neon-pink)]/20 px-3 py-1 rounded border border-[var(--neon-pink)]" onclick="sortVault()">SORT: REIHENFOLGE</button>
                <button class="text-[10px] bg-[var(--neon-cyan)]/20 px-3 py-1 rounded border border-[var(--neon-cyan)]" onclick="openPaperdoll()">PAPERDOLL SHEET</button>
            </div>
        </div>

        <!-- Paperdoll Sheet Modal -->
        <div id="paperdoll-os" class="os-modal glass pointer-events-auto bg-[#1a0b2e]/90">
            <div class="flex items-center justify-between p-3 border-b border-[var(--neon-cyan)]">
                <h3 class="text-xs font-bold text-[var(--neon-cyan)] tracking-widest text-glow">PLAYER PAPERDOLL</h3>
                <button onclick="toggleModal('paperdoll-os')" class="text-gray-400 hover:text-white"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            <div class="flex-1 overflow-y-auto p-4">
                <div class="border border-[var(--neon-pink)] p-3 rounded-lg bg-black/50 mb-4 text-xs font-mono text-gray-300">
                    <p class="mb-2 text-[var(--neon-pink)]">// PROMPT TEMPLATE - READY TO COPY</p>
                    <textarea id="prompt-area" class="w-full h-24 bg-transparent border border-gray-700 rounded p-2 text-[10px] focus:border-[var(--neon-cyan)] outline-none" readonly>
Name: [Insert Name]
Archetype: [Cyber-Runner / Net-Weaver / Vault-Hunter]
Core Color: #ff00ff
Primary Data Type: [3D / Video / Music / PDF]
Memory Link: Describe your anchor memory here...
                    </textarea>
                    <button class="mt-2 w-full py-1 bg-[var(--neon-cyan)] text-black font-bold rounded" onclick="copyPrompt()">COPY TO CLIPBOARD</button>
                </div>
                
                <div class="grid grid-cols-2 gap-3">
                    <div class="border border-white/20 rounded p-2 text-center text-[10px]">
                        <i data-lucide="user" class="w-8 h-8 mx-auto text-gray-400 mb-1"></i>
                        <span>Avatar Slot</span>
                    </div>
                    <div class="border border-white/20 rounded p-2 text-center text-[10px]">
                        <i data-lucide="database" class="w-8 h-8 mx-auto text-[var(--neon-pink)] mb-1"></i>
                        <span>Vault Link</span>
                    </div>
                    <div class="border border-white/20 rounded p-2 text-center text-[10px] col-span-2">
                        <i data-lucide="link" class="w-6 h-6 mx-auto text-[var(--neon-cyan)] mb-1"></i>
                        <span>Attach Note / Metadata</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom 1/3 Mobile Control Dashboard -->
        <div id="bottom-dashboard" class="pointer-events-auto">
            <!-- DJ Dial Toggle -->
            <div class="dj-dial-container" onclick="toggleOS()">
                <div class="dj-dial-inner"></div>
                <i data-lucide="power" class="absolute w-6 h-6 text-white z-10" style="filter: drop-shadow(0 0 5px black);"></i>
            </div>

            <div class="mt-10 grid grid-cols-3 gap-2 h-[calc(100%-50px)]">
                <!-- Left: Move Joystick -->
                <div class="flex flex-col items-center justify-center">
                    <span class="text-[9px] text-gray-400 mb-2 font-mono">MOVE</span>
                    <div class="joy-zone" id="joy-move">
                        <div class="joy-knob" id="knob-move"></div>
                    </div>
                </div>

                <!-- Center: Action Buttons -->
                <div class="flex flex-col items-center justify-center gap-3">
                    <button id="btn-cam" class="w-12 h-12 rounded-full border-2 border-[var(--neon-purple)] flex items-center justify-center text-[var(--neon-purple)] bg-[var(--neon-purple)]/10 hover:bg-[var(--neon-purple)]/30 transition-all text-glow shadow-[0_0_15px_var(--neon-purple)]">
                        <i data-lucide="camera" class="w-5 h-5"></i>
                    </button>
                    <button id="btn-web" class="w-16 h-16 rounded-full border-2 border-[var(--neon-pink)] flex items-center justify-center text-white bg-[var(--neon-pink)]/20 hover:bg-[var(--neon-pink)]/40 transition-all text-glow shadow-[0_0_20px_var(--neon-pink)]">
                        <i data-lucide="target" class="w-8 h-8"></i>
                    </button>
                    <span class="text-[9px] text-[var(--neon-pink)] font-mono text-glow">SHOOT WEB</span>
                </div>

                <!-- Right: Look Joystick -->
                <div class="flex flex-col items-center justify-center">
                    <span class="text-[9px] text-gray-400 mb-2 font-mono">LOOK</span>
                    <div class="joy-zone border-[var(--neon-orange)]" id="joy-look">
                        <div class="joy-knob bg-[var(--neon-orange)] shadow-[0_0_15px_var(--neon-orange)]" id="knob-look"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        if (typeof lucide !== 'undefined') lucide.createIcons();

        // --- Core Application State ---
        const State = {
            fpMode: false,
            spiderPos: new THREE.Vector3(0, 0, 50),
            spiderRot: new THREE.Vector2(0, 0), // Pitch, Yaw
            moveJoy: {x: 0, y: 0},
            lookJoy: {x: 0, y: 0},
            vaults: [], // Holds data for the OS
            activeVault: null,
            time: 0,
            webShots: []
        };

        const FILE_TYPES = [
            { id: '3d', icon: 'box', color: 0xff00ff, name: '3D Asset' },
            { id: 'pdf', icon: 'file-text', color: 0x00ffff, name: 'Document' },
            { id: 'music', icon: 'music', color: 0x9900ff, name: 'Audio Track' },
            { id: 'pic', icon: 'image', color: 0xff8800, name: 'Image' },
            { id: 'vid', icon: 'video', color: 0x00ff00, name: 'Video Feed' }
        ];

        // --- Three.js Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        // Dark twilight fog
        scene.fog = new THREE.FogExp2(0x0a0212, 0.003);

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 2000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        // Additive blending for glows requires a dark background
        renderer.setClearColor(0x0a0212, 1);
        container.appendChild(renderer.domElement);

        // --- Custom Twilight Skybox ---
        const skyGeo = new THREE.SphereGeometry(1000, 32, 32);
        const skyMat = new THREE.ShaderMaterial({
            uniforms: {
                topColor: { value: new THREE.Color(0x9d00ff) },
                bottomColor: { value: new THREE.Color(0xff8800) },
                offset: { value: 33 },
                exponent: { value: 0.6 }
            },
            vertexShader: `
                varying vec3 vWorldPosition;
                void main() {
                    vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                    vWorldPosition = worldPosition.xyz;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform vec3 topColor;
                uniform vec3 bottomColor;
                uniform float offset;
                uniform float exponent;
                varying vec3 vWorldPosition;
                void main() {
                    float h = normalize(vWorldPosition + offset).y;
                    gl_FragColor = vec4(mix(bottomColor, topColor, max(pow(max(h, 0.0), exponent), 0.0)), 1.0);
                }
            `,
            side: THREE.BackSide
        });
        const sky = new THREE.Mesh(skyGeo, skyMat);
        scene.add(sky);

        // Stars
        const starGeo = new THREE.BufferGeometry();
        const starPos = [];
        for(let i=0; i<2000; i++) {
            starPos.push((Math.random()-0.5)*1800, (Math.random()-0.5)*1800, (Math.random()-0.5)*1800);
        }
        starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
        const starMat = new THREE.PointsMaterial({color: 0xffffff, size: 2, transparent: true, opacity: 0.8});
        scene.add(new THREE.Points(starGeo, starMat));

        const mainGroup = new THREE.Group();
        scene.add(mainGroup);

        // Lighting
        scene.add(new THREE.AmbientLight(0x222222));
        const centerLight = new THREE.PointLight(0xff00ff, 3, 1000);
        scene.add(centerLight);


        // Helper to convert Geometry to dense Particle grid (The "smaller particle grid but sized up" request)
        function createParticleMesh(geometry, colorHex) {
            // Ensure high vertex count by using dense geometries
            const mat = new THREE.PointsMaterial({
                color: colorHex,
                size: 1.5,
                transparent: true,
                opacity: 0.9,
                blending: THREE.AdditiveBlending, // Maximum realistic neon glow
                depthWrite: false
            });
            const points = new THREE.Points(geometry, mat);
            return points;
        }

        // Build Animal Masks / Vaults using dense geometry combos
        function buildAnimalMask(type) {
            const group = new THREE.Group();
            let geo = new THREE.BufferGeometry();
            
            // We use standard geometries with high segments to create dense particle fields
            if(type === 'Bear') {
                const head = new THREE.SphereGeometry(15, 32, 32);
                const earL = new THREE.SphereGeometry(5, 16, 16); earL.translate(-12, 12, 0);
                const earR = new THREE.SphereGeometry(5, 16, 16); earR.translate(12, 12, 0);
                geo = BufferGeometryUtils.mergeBufferGeometries([head, earL, earR]);
            } else if (type === 'Fox') {
                const head = new THREE.ConeGeometry(12, 20, 32); head.rotateX(Math.PI/2);
                const earL = new THREE.ConeGeometry(4, 10, 16); earL.translate(-8, 8, -10);
                const earR = new THREE.ConeGeometry(4, 10, 16); earR.translate(8, 8, -10);
                geo = BufferGeometryUtils.mergeBufferGeometries([head, earL, earR]);
            } else {
                // Generic geometric mask for others to save code space
                const core = new THREE.TorusKnotGeometry(10, 3, 100, 16);
                geo = core;
            }
            
            return geo;
        }

        // Simple BufferGeometryUtils polyfill for merging
        const BufferGeometryUtils = {
            mergeBufferGeometries: function(geometries) {
                let offset = 0;
                let positionData = [];
                geometries.forEach(g => {
                    const positions = g.attributes.position.array;
                    for(let i=0; i<positions.length; i++) positionData.push(positions[i]);
                });
                const merged = new THREE.BufferGeometry();
                merged.setAttribute('position', new THREE.Float32BufferAttribute(positionData, 3));
                return merged;
            }
        };

        // Create Web
        const webLineMat = new THREE.LineBasicMaterial({ color: 0xff00ff, transparent: true, opacity: 0.15, blending: THREE.AdditiveBlending });
        const radials = 24;
        const rings = 12;
        const webRadius = 400;
        
        // Radials
        for(let i=0; i<radials; i++) {
            const angle = (i/radials) * Math.PI * 2;
            const pts = [new THREE.Vector3(0,0,0), new THREE.Vector3(Math.cos(angle)*webRadius, Math.sin(angle)*webRadius, (Math.random()-0.5)*30)];
            mainGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), webLineMat));
        }
        
        // Spirals & Nodes
        const nodes = [];
        let vaultIndex = 1;
        
        for(let r=1; r<=rings; r++) {
            const currentRadius = (r/rings) * webRadius;
            const pts = [];
            for(let i=0; i<=radials; i++) {
                const angle = (i/radials) * Math.PI * 2;
                const z = (Math.random()-0.5)*20;
                pts.push(new THREE.Vector3(Math.cos(angle)*currentRadius, Math.sin(angle)*currentRadius, z));
            }
            mainGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), webLineMat));

            // Populate Vaults
            if (r % 3 === 0) {
                const angle = (Math.random()) * Math.PI * 2;
                const fileType = FILE_TYPES[Math.floor(Math.random() * FILE_TYPES.length)];
                
                const geo = buildAnimalMask(Math.random() > 0.5 ? 'Bear' : 'Fox');
                const particleMesh = createParticleMesh(geo, fileType.color);
                particleMesh.position.set(Math.cos(angle)*currentRadius, Math.sin(angle)*currentRadius, (Math.random()-0.5)*20);
                
                // Add bounding sphere for raycasting (particles are hard to raycast)
                const hitMesh = new THREE.Mesh(new THREE.SphereGeometry(20, 8, 8), new THREE.MeshBasicMaterial({visible: false}));
                hitMesh.position.copy(particleMesh.position);
                
                const vaultData = {
                    id: `VLT-${vaultIndex++}`,
                    mesh: particleMesh,
                    hitMesh: hitMesh,
                    type: fileType,
                    player: `User_${Math.floor(Math.random()*9999)}`,
                    memory: `Encrypted fragment sector ${r}`
                };
                
                hitMesh.userData = vaultData;
                
                mainGroup.add(particleMesh);
                mainGroup.add(hitMesh);
                nodes.push(hitMesh);
                State.vaults.push(vaultData);
                
                // Add to top timeline
                addTimelineNode(vaultData);
            }
        }

        // --- The Player Spider ---
        const spiderGroup = new THREE.Group();
        const spiderMat = new THREE.MeshPhongMaterial({ color: 0x111111, emissive: 0xff00ff, emissiveIntensity: 0.8 });
        
        const abdomen = new THREE.Mesh(new THREE.SphereGeometry(6, 16, 16), spiderMat); abdomen.position.y = -5; abdomen.scale.set(1, 1.5, 1);
        const head = new THREE.Mesh(new THREE.SphereGeometry(3, 16, 16), spiderMat); head.position.y = 4;
        spiderGroup.add(abdomen, head);
        
        // Player Camera Anchor inside head
        const camAnchor = new THREE.Group();
        camAnchor.position.set(0, 4, 2);
        spiderGroup.add(camAnchor);

        scene.add(spiderGroup);
        spiderGroup.position.copy(State.spiderPos);


        // --- Controls & Joysticks ---
        function setupJoystick(zoneId, knobId, stateObj) {
            const zone = document.getElementById(zoneId);
            const knob = document.getElementById(knobId);
            let active = false;
            
            const move = (e) => {
                if(!active) return;
                const rect = zone.getBoundingClientRect();
                const center = { x: rect.left + rect.width/2, y: rect.top + rect.height/2 };
                let clientX = e.clientX || (e.touches && e.touches[0].clientX);
                let clientY = e.clientY || (e.touches && e.touches[0].clientY);
                
                let dx = clientX - center.x;
                let dy = clientY - center.y;
                const max = rect.width/2 - 20;
                const dist = Math.sqrt(dx*dx + dy*dy);
                
                if(dist > max) { dx = (dx/dist)*max; dy = (dy/dist)*max; }
                
                knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
                stateObj.x = dx / max;
                stateObj.y = dy / max;
            };
            
            zone.addEventListener('mousedown', () => active = true);
            window.addEventListener('mouseup', () => { active = false; knob.style.transform = `translate(-50%, -50%)`; stateObj.x = 0; stateObj.y = 0; });
            window.addEventListener('mousemove', move);
            
            zone.addEventListener('touchstart', (e) => { active = true; move(e); }, {passive: true});
            window.addEventListener('touchend', () => { active = false; knob.style.transform = `translate(-50%, -50%)`; stateObj.x = 0; stateObj.y = 0; });
            window.addEventListener('touchmove', move, {passive: true});
        }

        setupJoystick('joy-move', 'knob-move', State.moveJoy);
        setupJoystick('joy-look', 'knob-look', State.lookJoy);

        // --- Camera Toggle ---
        document.getElementById('btn-cam').addEventListener('click', () => {
            State.fpMode = !State.fpMode;
            document.getElementById('crosshair').style.opacity = State.fpMode ? 1 : 0;
            triggerNarrator(State.fpMode ? "First person mode activated! Aim and shoot those webs!" : "Overview mode. Look at that gorgeous network.");
        });

        // --- Web Shooting (Spider-Man style) ---
        const raycaster = new THREE.Raycaster();
        
        document.getElementById('btn-web').addEventListener('click', () => {
            if(!State.fpMode) { triggerNarrator("Switch to Camera mode first to shoot webs!"); return; }
            
            // Raycast forward from camera
            raycaster.set(camAnchor.getWorldPosition(new THREE.Vector3()), camAnchor.getWorldDirection(new THREE.Vector3()));
            const intersects = raycaster.intersectObjects(nodes);
            
            if(intersects.length > 0) {
                const target = intersects[0].object;
                const vaultData = target.userData;
                
                // Draw Pink Cylinder Web
                const start = camAnchor.getWorldPosition(new THREE.Vector3());
                const end = target.getWorldPosition(new THREE.Vector3());
                const dist = start.distanceTo(end);
                
                const webGeo = new THREE.CylinderGeometry(0.5, 0.5, dist, 8);
                const webMat = new THREE.MeshBasicMaterial({ color: 0xff00ff, transparent: true, opacity: 0.8 });
                const webMesh = new THREE.Mesh(webGeo, webMat);
                
                // Position and orient cylinder
                webMesh.position.copy(start).lerp(end, 0.5);
                webMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), end.clone().sub(start).normalize());
                scene.add(webMesh);
                
                State.webShots.push({ mesh: webMesh, age: 0 });
                
                // Pull spider towards target (Spider-Man Zip)
                triggerBlink(() => {
                    State.spiderPos.copy(end).add(new THREE.Vector3(0,0, 15)); // offset
                    // Update Color
                    spiderMat.emissive.setHex(vaultData.type.color);
                    document.getElementById('location-text').textContent = `SECTOR: ${vaultData.id} [${vaultData.type.name}]`;
                    triggerNarrator(`Zipped to ${vaultData.player}'s memory vault! Type: ${vaultData.type.name}.`);
                });
            } else {
                // Miss
                triggerNarrator("Missed! Aim for the glowing masks.");
            }
        });

        // --- Blink / Teleport Effect ---
        function triggerBlink(midpointCallback) {
            const overlay = document.getElementById('blink-overlay');
            overlay.classList.remove('blink-flash');
            void overlay.offsetWidth; // trigger reflow
            overlay.classList.add('blink-flash');
            
            setTimeout(() => {
                if(midpointCallback) midpointCallback();
            }, 240); // Call at peak of flash
        }

        // --- Timeline & OS UI ---
        function addTimelineNode(data) {
            const tl = document.getElementById('top-timeline');
            const el = document.createElement('div');
            el.className = 'timeline-node';
            el.innerHTML = `<i data-lucide="${data.type.icon}" class="w-4 h-4" style="color:#${data.type.color.toString(16).padStart(6,'0')}"></i>`;
            el.onclick = () => {
                triggerBlink(() => {
                    State.spiderPos.copy(data.mesh.getWorldPosition(new THREE.Vector3())).add(new THREE.Vector3(0,0,15));
                    document.getElementById('location-text').textContent = `SECTOR: ${data.id}`;
                    spiderMat.emissive.setHex(data.type.color);
                });
            };
            tl.appendChild(el);
            if (typeof lucide !== 'undefined') lucide.createIcons();
        }

        function toggleOS() {
            const os = document.getElementById('vault-os');
            if(os.classList.contains('show')) {
                os.classList.remove('show');
            } else {
                renderVaultOS('grid');
                os.classList.add('show');
                triggerNarrator("Opening Album OS. Check out the categorized files!");
            }
        }

        function toggleModal(id) {
            const el = document.getElementById(id);
            el.classList.toggle('show');
        }

        function openPaperdoll() {
            document.getElementById('vault-os').classList.remove('show');
            document.getElementById('paperdoll-os').classList.add('show');
            triggerNarrator("Time to customize your Player Paperdoll! Copy the prompt for easy sharing.");
        }

        function copyPrompt() {
            const text = document.getElementById('prompt-area').value;
            navigator.clipboard.writeText(text).then(() => {
                triggerNarrator("Prompt copied to clipboard! Dopamine injected. ✨");
            }).catch(err => {
                // Fallback for iframe execution
                const ta = document.getElementById('prompt-area');
                ta.select();
                document.execCommand('copy');
                triggerNarrator("Prompt copied! 👾");
            });
        }

        let isReihenfolge = false;
        function sortVault() {
            isReihenfolge = !isReihenfolge;
            renderVaultOS(document.querySelector('.view-btn.text-\\[var\\(--neon-pink\\)\\]').dataset.view);
            triggerNarrator(`Sorting updated: ${isReihenfolge ? 'Attached Reihenfolge' : 'Default ID'}`);
        }

        // View toggles
        document.querySelectorAll('.view-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const target = e.target.closest('button');
                document.querySelectorAll('.view-btn').forEach(b => {
                    b.classList.remove('text-[var(--neon-pink)]');
                    b.classList.add('text-gray-400');
                });
                target.classList.add('text-[var(--neon-pink)]');
                target.classList.remove('text-gray-400');
                renderVaultOS(target.dataset.view);
            });
        });

        function renderVaultOS(view) {
            const container = document.getElementById('vault-content');
            container.innerHTML = '';
            container.className = `flex-1 overflow-y-auto p-2 ${view === 'grid' ? 'grid grid-cols-3 gap-2' : 'flex flex-col gap-2'}`;
            
            let sortedVaults = [...State.vaults];
            if(isReihenfolge) {
                // Sort by type as a fake "reihenfolge"
                sortedVaults.sort((a,b) => a.type.name.localeCompare(b.type.name));
            }

            sortedVaults.forEach(v => {
                const colHex = `#${v.type.color.toString(16).padStart(6,'0')}`;
                if(view === 'grid') {
                    container.innerHTML += `
                        <div class="aspect-square bg-black/50 border border-[${colHex}] rounded-lg flex flex-col items-center justify-center p-2 hover:bg-white/10 cursor-pointer" onclick="triggerNarrator('Previewing ${v.id}')">
                            <i data-lucide="${v.type.icon}" class="w-8 h-8 mb-2" style="color:${colHex}"></i>
                            <span class="text-[8px] truncate w-full text-center">${v.id}</span>
                        </div>
                    `;
                } else {
                    container.innerHTML += `
                        <div class="w-full bg-black/50 border border-[${colHex}] rounded-lg flex items-center p-3 gap-3 hover:bg-white/10 cursor-pointer" onclick="triggerNarrator('Previewing ${v.id}')">
                            <i data-lucide="${v.type.icon}" class="w-6 h-6" style="color:${colHex}"></i>
                            <div class="flex-1 min-w-0">
                                <h4 class="text-xs font-bold truncate">${v.id} - ${v.player}</h4>
                                <p class="text-[9px] text-gray-400 truncate">${v.memory}</p>
                            </div>
                        </div>
                    `;
                }
            });
            if (typeof lucide !== 'undefined') lucide.createIcons();
        }

        // --- JRPG Narrator Engine ---
        let narrateTimeout;
        function triggerNarrator(text) {
            const panel = document.getElementById('jrpg-narrator');
            const p = document.getElementById('jrpg-text');
            p.textContent = text;
            panel.classList.add('active');
            
            clearTimeout(narrateTimeout);
            narrateTimeout = setTimeout(() => {
                panel.classList.remove('active');
            }, 4000);
        }


        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            State.time += delta;

            // Animate Web Nodes (Pulsing)
            State.vaults.forEach((v, i) => {
                v.mesh.rotation.y += 0.01;
                v.mesh.rotation.x = Math.sin(State.time * 2 + i) * 0.2;
                // Make particle material pulse slightly
                v.mesh.material.size = 1.5 + Math.sin(State.time * 3 + i) * 0.5;
            });

            // Handle Spider & Camera Movement
            if (State.fpMode) {
                // Apply Look Joystick to Camera Anchor Rotation
                State.spiderRot.y -= State.lookJoy.x * 0.05;
                State.spiderRot.x -= State.lookJoy.y * 0.05;
                // Clamp Pitch
                State.spiderRot.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, State.spiderRot.x));
                
                camAnchor.rotation.set(State.spiderRot.x, State.spiderRot.y, 0, 'YXZ');
                
                // Move Spider based on camera direction
                if(Math.abs(State.moveJoy.y) > 0.1 || Math.abs(State.moveJoy.x) > 0.1) {
                    const dir = new THREE.Vector3(State.moveJoy.x, 0, State.moveJoy.y);
                    dir.applyEuler(new THREE.Euler(0, State.spiderRot.y, 0));
                    dir.normalize().multiplyScalar(40 * delta);
                    State.spiderPos.add(dir);
                }

                // Smooth follow position
                spiderGroup.position.lerp(State.spiderPos, 0.1);
                
                // Camera follows anchor exactly
                camera.position.copy(camAnchor.getWorldPosition(new THREE.Vector3()));
                camera.quaternion.copy(camAnchor.getWorldQuaternion(new THREE.Quaternion()));

            } else {
                // Third Person Overview
                spiderGroup.position.lerp(State.spiderPos, 0.05);
                
                const targetCamPos = new THREE.Vector3(
                    spiderGroup.position.x + Math.sin(State.time * 0.2) * 150,
                    spiderGroup.position.y - 150,
                    spiderGroup.position.z + 100
                );
                camera.position.lerp(targetCamPos, 0.03);
                camera.lookAt(spiderGroup.position);
            }

            // Cleanup old webs
            for(let i = State.webShots.length - 1; i >= 0; i--) {
                State.webShots[i].age += delta;
                State.webShots[i].mesh.material.opacity = 0.8 * (1 - State.webShots[i].age);
                if(State.webShots[i].age > 1) {
                    scene.remove(State.webShots[i].mesh);
                    State.webShots.splice(i, 1);
                }
            }

            // Rotate whole structure slightly in TP mode
            if(!State.fpMode) {
                mainGroup.rotation.z = Math.sin(State.time * 0.05) * 0.2;
            }

            renderer.render(scene, camera);
        }

        // Handle Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Start
        setTimeout(() => triggerNarrator("Welcome to the Vault! Toggle the cyber-dial below to access your files."), 1000);
        animate();

    </script>
</body>
</html>
